

services:

  # ─── SERVICE BACKEND ───────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"        # ton PC:8000 → container:8000
    volumes:
      - ./backend:/app     # ← HOT-RELOAD : tes fichiers locaux montés en direct
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=damxscorp.settings  # ← adapte si ton nom diffère
    restart: unless-stopped

  # ─── SERVICE FRONTEND ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app              # ← HOT-RELOAD
      - /app/node_modules            # ← IMPORTANT : protège node_modules du container
    environment:
      - CHOKIDAR_USEPOLLING=true     # nécessaire pour hot-reload dans Docker
      - WATCHPACK_POLLING=true       # idem, pour Webpack
    depends_on:
      - backend                      # frontend attend que backend soit prêt
    restart: unless-stopped