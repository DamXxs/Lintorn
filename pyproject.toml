[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lintorn"
version = "0.1.0"
description = "Audits your code and the memory your AI assistant reads — and tells you when the two drift apart."
readme = "README.md"
requires-python = ">=3.11"          # tomllib (stdlib) pour lire [tool.lintorn]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Olotorn" }]
keywords = ["lint", "audit", "code-quality", "llm", "ai-agents", "documentation"]

# AUCUNE dépendance, et c'est un engagement, pas un hasard : Lintorn doit
# pouvoir tourner dans un hook git avec n'importe quel python du système.
# Tout ce qu'il lance (ruff, pytest, django) appartient au projet audité,
# jamais à Lintorn — il les appelle s'ils sont là, il le dit s'ils manquent.
dependencies = []

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/DamXxs/Lintorn"
Issues = "https://github.com/DamXxs/Lintorn/issues"

[project.scripts]
lintorn = "lintorn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lintorn"]

# Les hooks sont des DONNÉES du paquet : sans cette ligne, hatchling n'embarque
# que les .py et `--installer-hook` n'aurait plus rien à installer.
[tool.hatch.build.targets.wheel.force-include]
"src/lintorn/hooks" = "lintorn/hooks"
"src/lintorn/hooks_claude" = "lintorn/hooks_claude"

[tool.pytest.ini_options]
testpaths = ["tests"]
