# Les regles maison de ce projet.
#   https://github.com/DamXxs/Lintorn
#
# Un fichier a part parce qu'il VIT : il grossit, on l'edite souvent,
# on le relit a plusieurs. `config.toml`, a cote, est un reglage qu'on
# ecrit une fois. Les deux se versionnent.
#
# Lintorn ne peut PAS deviner une regle maison : c'est une decision,
# elle n'est ecrite nulle part dans le code.
#
# bloquant = true  -> regle DEJA respectee, on empeche la regression
# bloquant = false -> dette existante, on mesure sans bloquer

[[regles]]
nom      = "Chemin de projet ecrit en dur"
regle    = "Lintorn doit rester neutre : aucun nom de projet dans le code"
racine   = "src/lintorn"
suffixes = [".py"]
motif    = 'matorn|/home/|C:\\\\Users'
exclure  = []
bloquant = true

[[regles]]
nom      = "print() de debogage oublie"
regle    = "la sortie utilisateur passe par le rapport ou le CLI, pas par des print egares"
racine   = "src/lintorn"
suffixes = [".py"]
motif    = '^\s+print\(f?"(DEBUG|TODO|XXX)'
exclure  = []
bloquant = true

# ── Esquisses : tes regles de doc qui n'ont pas encore de controle ───
# Lintorn les a reperees, mais il NE PEUT PAS deviner comment les
# detecter : « jamais de couleur en dur » ne dit pas s'il faut traquer
# #fff, rgba( ou hsl(, ni s'il faut epargner les commentaires. C'est une
# decision technique, et une regex devinee ne produirait que des faux
# positifs — de quoi cesser de faire confiance au rapport.
#
# Decommente celles qui comptent, ecris leur `motif`, jette les autres.
#
# `source` evite de RECOPIER la phrase ici : la regle reste enoncee a un
# seul endroit, et Lintorn sait qu'elle a desormais un controle.


# Les chemins | Tout part du **projet audité** (`RACINE`, déduite du dossier courant), jamais de `__fi
# ⚠️ LAISSEE VIDE EXPRES. `__file__` apparait 3 fois, toutes legitimes
#    (dont 2 dans des commentaires qui expliquent justement le piege).
#    Toute regex crierait sur du code correct : mieux vaut pas de regle
#    qu'une regle qu'on apprend a ignorer.
# [[regles]]
# source   = "CLAUDE.md:39"
# nom      = "Les chemins"
# racine   = "."          # <- restreins au dossier concerne
# suffixes = []   # <- a preciser : .py, .ts, .css...
# motif    = ''            # <- A ECRIRE : ce qui repere une VIOLATION
# bloquant = false         # true quand la regle est deja tenue partout


# Défauts non invasifs | Rien qui exécute le code du projet, sorte sur le réseau ou ouvre une base **s
# ⚠️ LAISSEE VIDE EXPRES. « rien d'invasif sans opt_in » est une propriete
#    STRUCTURELLE : il faut lire toutes les commandes et verifier que
#    chacune porte `opt_in`. Une regex ne voit pas ca. C'est deja
#    couvert par un test : test_les_controles_invasifs_sont_desactives.
# [[regles]]
# source   = "CLAUDE.md:42"
# nom      = "Défauts non invasifs"
# racine   = "."          # <- restreins au dossier concerne
# suffixes = []   # <- a preciser : .py, .ts, .css...
# motif    = ''            # <- A ECRIRE : ce qui repere une VIOLATION
# bloquant = false         # true quand la regle est deja tenue partout

# Préfixes de chemins | Déduits de la détection (`PREFIXE_BACKEND`, `PREFIXES_PROJET`), jamais écrits.
# ⚠️ LAISSEE VIDE EXPRES. Un prefixe « ecrit en dur » n'a pas de forme
#    reconnaissable. La regle « Chemin de projet ecrit en dur » couvre
#    deja les cas concrets rencontres.
# [[regles]]
# source   = "CLAUDE.md:43"
# nom      = "Préfixes de chemins"
# racine   = "."          # <- restreins au dossier concerne
# suffixes = []   # <- a preciser : .py, .ts, .css...
# motif    = ''            # <- A ECRIRE : ce qui repere une VIOLATION
# bloquant = false         # true quand la regle est deja tenue partout

# Versions | Un numéro publié sur PyPI est **définitif**. Corriger, c'est publier la version suivante.
# ⚠️ LAISSEE VIDE EXPRES. Comparer DEUX fichiers depasse une regex, qui
#    lit un fichier a la fois. Couverte par un test :
#    test_les_deux_numeros_de_version_sont_d_accord.
# [[regles]]
# source   = "CLAUDE.md:50"
# nom      = "Versions"
# racine   = "."          # <- restreins au dossier concerne
# suffixes = [".py", ".toml"]
# motif    = ''            # <- A ECRIRE : ce qui repere une VIOLATION
# bloquant = false         # true quand la regle est deja tenue partout

# ── Tirees de CLAUDE.md, motifs ecrits et eprouves ───────────────────
# Les deux ont ZERO occurrence aujourd'hui : la regle est deja tenue,
# donc `bloquant = true` verrouille du terrain gagne.

[[regles]]
source   = "CLAUDE.md:38"
nom      = "Une dependance ajoutee au paquet"
racine   = "."
suffixes = [".toml"]
# `[^\s\]]` et pas `\S` : sinon le `]` de `dependencies = []` compterait
# comme une dependance, et la regle crierait sur un projet conforme.
motif    = '^dependencies\s*=\s*\[\s*[^\s\]]'
exclure  = []
bloquant = true

[[regles]]
source   = "CLAUDE.md:40"
nom      = "Outil externe lance avec le python de Lintorn"
racine   = "src/lintorn"
suffixes = [".py"]
# Motif volontairement ETROIT : `sys.executable` seul apparait
# legitimement deux fois (le repli de `_python_du_projet`, et une
# comparaison dans cli.py). Seul son usage comme LANCEUR est fautif.
motif    = 'subprocess\.run\(\s*\[\s*sys\.executable'
exclure  = []
bloquant = true
