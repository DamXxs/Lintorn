{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <title>Empire Méca — Planning</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
</head>
<body>
    <div class="main-layout">
    
    <main id="calendar-container">
        <div id='calendar'></div>
    </main>

    <aside id="info-column">
        <div id="info-content">
            <div class="detail-row"><strong>Note:</strong> <p id="view-note">-</p></div>

            <button id="btn-edit-mode" onclick="ouvrirModal()" style="display:none;
            width:100%;
            margin-top:20px;
            background:var(--accent);
            color:white; border:none;
            padding:10px;
            border-radius:8px;
            cursor:pointer;">
                Modifier la fiche
            </button>
        </div>
        <div class="info-card">
            <h3>Détails Sélection</h3>
            <hr>
            <div id="info-content">
                <p class="placeholder-text">Sélectionnez un rendez-vous pour voir les détails</p>
                <div class="detail-row"><strong>Client:</strong> <span id="view-client">-</span></div>
                <div class="detail-row"><strong>Véhicule:</strong> <span id="view-vehicule">-</span></div>
                <div class="detail-row"><strong>Plaque:</strong> <span id="view-plaque">-</span></div>
                <div class="detail-row"><strong>Note:</strong> <p id="view-note">-</p></div>
            </div>
        </div>
    </aside>

</div>

    <aside class="floating-menu">
        <button onclick="ouvrirModal()" class="bubble-btn" style="background: #27ae60;" title="Nouveau Rendez-vous">➕</button>
        <button onclick="filtrerCalendrier('TOUT')" class="bubble-btn" style="background: #444;" title="Voir tout les Rendez-vous">👁️</button>
        <button onclick="filtrerCalendrier('ATELIER')" class="bubble-btn" style="background: #2980b9;" title="Rendez-vous Atelier">🔧</button>
        <button onclick="filtrerCalendrier('ACADEMIE')" class="bubble-btn" style="background: #e74c3c;" title="Rendez-vous Académie">🎓</button>
    </aside>

    <div id="modal-rdv">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0">Rendez-vous</h3>
            <form method="POST" action="{% url 'creer_rdv' %}" id="form-rdv">
                {% csrf_token %}
                <input type="hidden" name="rdv_id" id="input-rdv-id">
                <div class="form-group"><label>DÉPARTEMENT</label>
                    <select name="departement" id="select-departement" onchange="toggleVoiture()">
                        <option value="ATELIER">🔧 ATELIER</option>
                        <option value="ACADEMIE">🎓 ACADÉMIE</option>
                    </select>
                </div>
                <div class="form-group"><label>NOM CLIENT</label><input type="text" name="clientName" required></div>
                <div class="form-group"><label>PRÉNOM CLIENT</label><input type="text" name="clientFirstName" required></div>
                <div class="form-group"><label>E-MAIL</label><input type="text" name="clientMail"></div>
                <div class="form-group"><label>TEL</label><input type="text" name="clientPhone"></div>
                <div class="form-group"><label>ADRESSE</label><input type="text" name="clientAddress"></div>

                <div id="section-vehicule">
                    <div class="form-group"><label>PLAQUE</label><input type="text" name="plate"></div>
                    <div class="form-group"><label>MODÈLE</label><input type="text" name="vehicleModel"></div>
                    <div class="form-group"><label>MARQUE</label><input type="text" name="vehicleBrand"></div>
                    <div class="form-group"><label>ANNÉE</label><input type="number" name="vehicleYear" min="1900" max="2100"></div>
                    <div class="form-group"><label>KILOMÉTRAGE</label><input type="number" name="mileage" min="0"></div>
                    <div class="form-group"><label>TYPE D'INTERVENTION</label><input type="text" name="serviceType"></div>
                    <div class="form-group"><label>VIN</label><input type="text" name="vin"></div>
                </div>
                <div style="display:flex; gap:10px">
                    <div class="form-group" style="flex:2"><label>DATE</label><input type="date" name="date" required></div>
                    <div class="form-group" style="flex:1"><label>HEURE</label><input type="time" name="time" required></div>
                </div>
                <div class="form-group"><label>NOTE / DESCRIPTION</label><input type="text" name="description"></div>
                
                <div style="margin-top:25px; display:flex; justify-content: space-between; gap:10px">
                    <button type="button" onclick="fermerModal()" style="background:#444; color:white; border:none; padding:12px; border-radius:10px; flex:1">Fermer</button>
                    <a id="btn-supprimer" href="#" style="background:#c0392b; color:white; padding:12px; border-radius:10px; text-decoration:none; display:none; text-align:center; flex:1">Supprimer</a>
                    <button type="submit" style="background:#27ae60; color:white; border:none; padding:12px; border-radius:10px; flex:1">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script id="rdv-data" type="application/json">
    {{ rdv_json_raw|safe }}
    </script>
    <script src="{% static 'core/script.js' %}"></script>
</body>  
</html>
